# ESPHome LD2450 presence node — copy once per room, change only `name`/`friendly_name`.
# Board: ESP32-DevKitC-32. Wiring: LD2450 5V->5V, GND->GND, TX->GPIO16, RX->GPIO17.
esphome:
  name: presence-room
  friendly_name: Presence Room

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  baud_rate: 0

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "presence-room"

captive_portal:

uart:
  id: uart_ld2450
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2450:
  id: radar
  uart_id: uart_ld2450

binary_sensor:
  - platform: ld2450
    ld2450_id: radar
    has_target:
      name: Presence
    has_moving_target:
      name: Moving Target
    has_still_target:
      name: Still Target

sensor:
  - platform: ld2450
    ld2450_id: radar
    target_count:
      name: Target Count
    target_1:
      x: {name: Target 1 X}
      y: {name: Target 1 Y}
      speed: {name: Target 1 Speed}
      distance: {name: Target 1 Distance}
    target_2:
      x: {name: Target 2 X}
      y: {name: Target 2 Y}
      speed: {name: Target 2 Speed}
      distance: {name: Target 2 Distance}
    target_3:
      x: {name: Target 3 X}
      y: {name: Target 3 Y}
      speed: {name: Target 3 Speed}
      distance: {name: Target 3 Distance}

number:
  - platform: ld2450
    ld2450_id: radar
    presence_timeout:
      name: Presence Timeout

switch:
  - platform: ld2450
    ld2450_id: radar
    bluetooth:
      name: Radar Bluetooth
    multi_target:
      name: Multi Target Tracking

button:
  - platform: restart
    name: Restart
